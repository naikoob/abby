[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abby"
version = "0.1.0"
description = "Core CLI tool and knowledge vault manager for Abby Knowledge Vault"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Abby Knowledge Vault Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Topic :: Utilities"
]

[project.scripts]
abby = "abby.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["abby"]

